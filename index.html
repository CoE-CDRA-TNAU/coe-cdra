<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoE-CDRA – Website versions</title>
  <link rel="icon" type="image/png" sizes="32x32" href="Website_Modern/assets/favicon-32.png">
  <style>
    :root { --ink:#0c1f19; --muted:#64776f; --line:#e2e9e5; --bg:#f5f8f6; --card:#fff; --forest:#0b3b2c; --leaf:#15803d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height:1.5; }
    main { max-width:960px; margin:0 auto; padding:48px 16px; }
    header { display:flex; align-items:center; gap:16px; margin-bottom:32px; }
    header img { width:64px; height:64px; }
    h1 { margin:0; font-size:1.5rem; color:var(--forest); }
    header p { margin:4px 0 0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
    a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; text-decoration:none; color:inherit; }
    a.card:hover, a.card:focus { border-color:var(--leaf); }
    a.card h2 { margin:0 0 6px; font-size:1.1rem; color:var(--leaf); }
    a.card p { margin:0; color:var(--muted); font-size:.95rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="Website_Modern/LOGO/DST-CoE.png" alt="CoE-CDRA logo">
      <div>
        <h1>CoE-CDRA website – design versions</h1>
        <p>DST-Centre of Excellence for Climate and Disaster Resilient Agriculture, TNAU</p>
      </div>
    </header>
    <div class="grid">
      <a class="card" href="Website_Modern/"><h2>Modern</h2><p>New design with the live weather forecast.</p></a>
      <a class="card" href="Website/"><h2>Original</h2><p>The first version of the site.</p></a>
      <a class="card" href="Website_Light/"><h2>Light</h2><p>Light colour scheme, content-first layout.</p></a>
    </div>
  </main>
</body>
</html>
